<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Light Speed Future ⚡</title>

<style>
body {
  margin: 0;
  background: #0b0b12;
  color: white;
  font-family: Arial, sans-serif;
}

header {
  text-align: center;
  padding: 20px;
  background: #11111a;
}

h1 {
  margin: 0;
}

#status {
  color: #aaa;
  margin-top: 8px;
}

#chat {
  padding: 20px;
  padding-bottom: 100px;
}

.message {
  max-width: 85%;
  padding: 12px 15px;
  margin: 12px 0;
  border-radius: 15px;
  white-space: pre-wrap;
}

.user {
  background: #315cff;
  margin-left: auto;
}

.ai {
  background: #1b1b27;
}

#inputArea {
  position: fixed;
  bottom: 0;
  left: 0;
  right: 0;
  padding: 12px;
  background: #11111a;
  display: flex;
  gap: 8px;
}

#input {
  flex: 1;
  padding: 13px;
  border: 0;
  border-radius: 12px;
  background: #22222e;
  color: white;
  font-size: 16px;
}

#send {
  padding: 0 18px;
  border: 0;
  border-radius: 12px;
  background: #315cff;
  color: white;
  font-weight: bold;
}

button:disabled,
input:disabled {
  opacity: .5;
}
</style>
</head>

<body>

<header>
  <h1>Light Speed Future ⚡</h1>
  <div id="status">Starting AI...</div>
</header>

<div id="chat">
  <div class="message ai">
    Hello! I'm Light Speed Future. ⚡
  </div>
</div>

<div id="inputArea">
  <input id="input" placeholder="Ask me anything..." disabled>
  <button id="send" disabled>Send</button>
</div>

<script type="module">

import { pipeline } from
"https://cdn.jsdelivr.net/npm/@huggingface/transformers@4.0.1";

const chat = document.getElementById("chat");
const input = document.getElementById("input");
const send = document.getElementById("send");
const status = document.getElementById("status");

let assistant;

function addMessage(text, type) {
  const message = document.createElement("div");
  message.className = "message " + type;
  message.textContent = text;
  chat.appendChild(message);
  window.scrollTo(0, document.body.scrollHeight);
  return message;
}

async function startAI() {
  try {

    status.textContent = "Downloading AI brain...";

    assistant = await pipeline(
      "text-generation",
      "onnx-community/SmolLM2-360M-ONNX"
    );

    status.textContent = "AI ready ⚡";

    input.disabled = false;
    send.disabled = false;

    addMessage(
      "I'm online! Ask me something. ⚡",
      "ai"
    );

  } catch (error) {

    console.error(error);

    status.textContent = "AI could not start";

    addMessage(
      "The AI could not start. Check your internet connection and try again.",
      "ai"
    );
  }
}

async function askAI() {

  const question = input.value.trim();

  if (!question || !assistant) return;

  input.value = "";

  addMessage(question, "user");

  input.disabled = true;
  send.disabled = true;
  status.textContent = "Thinking...";

  try {

    const messages = [
      {
        role: "system",
        content:
        "You are Light Speed Future, a helpful personal AI assistant. Answer clearly and directly."
      },
      {
        role: "user",
        content: question
      }
    ];

    const result = await assistant(messages, {
      max_new_tokens: 200
    });

    const generated = result[0].generated_text;

    let answer = "";

    if (Array.isArray(generated)) {
      const last = generated[generated.length - 1];

      if (last && last.content) {
        answer = last.content;
      }
    }

    if (!answer) {
      answer = "I couldn't generate an answer.";
    }

    addMessage(answer, "ai");

  } catch (error) {

    console.error(error);

    addMessage(
      "I had trouble generating that answer. Please try again.",
      "ai"
    );
  }

  status.textContent = "AI ready ⚡";
  input.disabled = false;
  send.disabled = false;
  input.focus();
}

send.addEventListener("click", askAI);

input.addEventListener("keydown", event => {
  if (event.key === "Enter") {
    askAI();
  }
});

startAI();

</script>

</body>
</html>
