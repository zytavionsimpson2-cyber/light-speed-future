<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Light Speed Future</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, sans-serif;
      background: #05070d;
      color: white;
      min-height: 100vh;
    }

    .app {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    header {
      padding: 18px 20px;
      border-bottom: 1px solid #202637;
      background: #080b14;
    }

    header h1 {
      font-size: 24px;
      letter-spacing: 1px;
    }

    header p {
      color: #8c96aa;
      margin-top: 5px;
      font-size: 14px;
    }

    .chat {
      flex: 1;
      padding: 25px 20px 120px;
      max-width: 850px;
      width: 100%;
      margin: auto;
    }

    #messages {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .welcome {
      text-align: center;
      margin-top: 15vh;
    }

    .welcome h2 {
      font-size: 32px;
      margin-bottom: 12px;
    }

    .welcome p {
      color: #9aa3b5;
      line-height: 1.5;
    }

    .message {
      padding: 14px 16px;
      border-radius: 14px;
      line-height: 1.5;
      white-space: pre-wrap;
      word-wrap: break-word;
    }

    .user {
      background: #1c2638;
      align-self: flex-end;
      max-width: 82%;
    }

    .ai {
      background: #111624;
      align-self: flex-start;
      max-width: 82%;
    }

    .input-area {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      padding: 12px 15px;
      background: #080b14;
      border-top: 1px solid #202637;
    }

    .input-box {
      max-width: 850px;
      margin: auto;
      display: flex;
      gap: 10px;
    }

    input {
      flex: 1;
      min-width: 0;
      padding: 15px;
      border-radius: 12px;
      border: 1px solid #30384d;
      background: #111624;
      color: white;
      font-size: 16px;
      outline: none;
    }

    input:focus {
      border-color: #68738a;
    }

    button {
      padding: 15px 20px;
      border: none;
      border-radius: 12px;
      background: white;
      color: #05070d;
      font-weight: bold;
      cursor: pointer;
    }

    button:active {
      transform: scale(0.97);
    }

    .status {
      text-align: center;
      color: #68738a;
      font-size: 12px;
      margin-top: 10px;
    }
  </style>
</head>

<body>

  <div class="app">

    <header>
      <h1>⚡ Light Speed Future</h1>
      <p>Your personal AI assistant</p>
    </header>

    <main class="chat">

      <div id="messages">

        <div class="welcome" id="welcome">
          <h2>Welcome to Light Speed Future</h2>

          <p>
            Your personal AI assistant is being built.
            <br>
            Ask me something to begin.
          </p>
        </div>

      </div>

    </main>

    <div class="input-area">

      <div class="input-box">

        <input
          id="userInput"
          type="text"
          placeholder="Ask Light Speed Future..."
          autocomplete="off"
        >

        <button onclick="sendMessage()">Send</button>

      </div>

      <div class="status">
        Light Speed Future • AI system under construction
      </div>

    </div>

  </div>


  <script>

    let conversation = [];


    function addMessage(text, type) {

      const messages = document.getElementById("messages");

      const message = document.createElement("div");

      message.className = "message " + type;

      message.textContent = text;

      messages.appendChild(message);

      window.scrollTo(0, document.body.scrollHeight);

    }


    function getAIResponse(question) {

      const q = question.toLowerCase();


      if (
        q.includes("hello") ||
        q.includes("hi") ||
        q.includes("hey")
      ) {
        return "Hello! I'm Light Speed Future. ⚡ I'm ready to become your personal AI assistant.";
      }


      if (
        q.includes("who are you") ||
        q.includes("what are you")
      ) {
        return "I'm Light Speed Future, your personal AI assistant. My full AI brain is still being connected.";
      }


      if (
        q.includes("what can you do")
      ) {
        return "My planned abilities include answering questions, analyzing information, understanding images, using current internet information, helping with business ideas, manhwa creation, game development, and eventually trading analysis.";
      }


      if (
        q.includes("light speed future")
      ) {
        return "Light Speed Future is your personal AI assistant project. ⚡ We're building it step-by-step.";
      }


      if (
        q.includes("help")
      ) {
        return "I can currently handle basic conversation and demonstrate the assistant interface. The next stage is connecting a real AI model.";
      }


      return "I received your question: \"" +
        question +
        "\"\n\nMy full AI model isn't connected yet. This version is the foundation we're using to build the real Light Speed Future brain.";
    }


    function sendMessage() {

      const input = document.getElementById("userInput");

      const text = input.value.trim();

      if (text === "") {
        return;
      }


      const welcome = document.getElementById("welcome");

      if (welcome) {
        welcome.remove();
      }


      addMessage(text, "user");

      conversation.push({
        role: "user",
        content: text
      });


      input.value = "";

      input.disabled = true;


      setTimeout(function() {

        const response = getAIResponse(text);

        addMessage(response, "ai");

        conversation.push({
          role: "assistant",
          content: response
        });

        input.disabled = false;

        input.focus();

      }, 500);

    }


    document
      .getElementById("userInput")
      .addEventListener("keydown", function(event) {

        if (event.key === "Enter") {
          sendMessage();
        }

      });

  </script>

</body>
</html>
