<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Light Speed Future ⚡</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  background: #0b0b12;
  color: white;
  font-family: Arial, sans-serif;
  height: 100vh;
  display: flex;
  flex-direction: column;
}

header {
  text-align: center;
  padding: 18px;
  background: #11111a;
  border-bottom: 1px solid #292936;
}

h1 {
  margin: 0;
  font-size: 24px;
}

#status {
  margin-top: 6px;
  color: #aaa;
  font-size: 13px;
}

#chat {
  flex: 1;
  overflow-y: auto;
  padding: 20px;
  padding-bottom: 90px;
}

.message {
  max-width: 85%;
  padding: 12px 15px;
  margin: 12px 0;
  border-radius: 15px;
  line-height: 1.45;
  white-space: pre-wrap;
}

.user {
  background: #315cff;
  margin-left: auto;
}

.ai {
  background: #1b1b27;
  margin-right: auto;
}

#inputArea {
  position: fixed;
  bottom: 0;
  left: 0;
  right: 0;
  padding: 12px;
  background: #11111a;
  border-top: 1px solid #292936;
  display: flex;
  gap: 8px;
}

#input {
  flex: 1;
  padding: 13px;
  border: none;
  border-radius: 12px;
  background: #22222e;
  color: white;
  font-size: 16px;
  outline: none;
}

#send {
  border: none;
  border-radius: 12px;
  padding: 0 18px;
  background: #315cff;
  color: white;
  font-weight: bold;
}

#send:disabled,
#input:disabled {
  opacity: 0.5;
}
</style>
</head>

<body>

<header>
  <h1>Light Speed Future ⚡</h1>
  <div id="status">Starting AI...</div>
</header>

<div id="chat">
  <div class="message ai">
    Hello! I'm Light Speed Future. ⚡
    I'm starting my AI brain.
  </div>
</div>

<div id="inputArea">
  <input id="input" placeholder="Ask Light Speed Future..." disabled>
  <button id="send" disabled>Send</button>
</div>

<script type="module">

import { pipeline } from
"https://cdn.jsdelivr.net/npm/@huggingface/transformers@4.0.1";

const chat = document.getElementById("chat");
const input = document.getElementById("input");
const send = document.getElementById("send");
const status = document.getElementById("status");

let ai = null;

function addMessage(text, type) {
  const message = document.createElement("div");
  message.className = "message " + type;
  message.textContent = text;
  chat.appendChild(message);
  chat.scrollTop = chat.scrollHeight;
  return message;
}

async function startAI() {

  try {

    status.textContent = "Downloading smaller AI brain...";

 ai = await pipeline(
      "text-generation",
      "onnx-community/SmolLM2-135M-Instruct-ONNX",
      {
        dtype: "q4",
        device: "wasm"
      }
    );

    status.textContent = "AI ready ⚡";

    input.disabled = false;
    send.disabled = false;

    addMessage(
      "I'm online! ⚡ Ask me something.",
      "ai"
    );

  } catch (error) {

    console.error(error);

    status.textContent = "AI could not start";

    addMessage(
      "The AI could not start on this device. Please try again.",
      "ai"
    );
  }
}
let isThinking = false;

async function askAI() {

  if (isThinking) return;

  const question = input.value.trim();

  if (!question || !ai) return;

  isThinking = true;

  input.value = "";

  addMessage(question, "user");

  input.disabled = true;
  send.disabled = true;
  status.textContent = "Thinking...";

  try {

    const messages = [
      {
        role: "system",
        content:
          "You are Light Speed Future, a highly capable personal AI assistant. Your job is to help the user understand things, solve problems, plan projects, learn, create, and make decisions. Be clear, accurate, practical, and direct. Give the answer first, then explain when useful. Remember relevant information from the current conversation. Do not repeat questions the user has already answered. Never invent facts. If you are unsure, say so. Follow instructions carefully. When giving instructions, use clear step-by-step guidance. Keep responses natural and easy to understand."
      },
      {
        role: "user",
        content: question
      }
    ];

    const result = await ai(messages, {
      max_new_tokens: 150,
      temperature: 0.5,
      do_sample: true
    });

    let answer = "";

    if (result && result[0]) {

      const generated = result[0].generated_text;

      if (Array.isArray(generated)) {

        const last = generated[generated.length - 1];

        if (last && last.content) {
          answer = last.content;
        }

      } else if (typeof generated === "string") {

        answer = generated;
      }
    }

    if (!answer) {
      answer = "I couldn't generate an answer.";
    }

    addMessage(answer, "ai");

  } catch (error) {

    console.error(error);

    addMessage(
      "I had trouble generating that answer. Please try again.",
      "ai"
    );

  } finally {

    isThinking = false;

    status.textContent = "AI ready ⚡";
    input.disabled = false;
    send.disabled = false;
    input.focus();
  }
}

send.addEventListener("click", askAI);

input.addEventListener("keydown", function(event) {

  if (event.key === "Enter") {
    askAI();
  }

});

startAI();

</script>

</body>
</html>
