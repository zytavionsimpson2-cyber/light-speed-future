<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Light Speed Future</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, sans-serif;
      background: #05070d;
      color: white;
      min-height: 100vh;
    }

    .app {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    header {
      padding: 20px;
      border-bottom: 1px solid #202637;
      background: #080b14;
    }

    header h1 {
      font-size: 24px;
      letter-spacing: 1px;
    }

    header p {
      color: #8c96aa;
      margin-top: 5px;
      font-size: 14px;
    }

    .chat {
      flex: 1;
      padding: 25px 20px;
      max-width: 800px;
      width: 100%;
      margin: auto;
    }

    .welcome {
      text-align: center;
      margin-top: 15vh;
    }

    .welcome h2 {
      font-size: 32px;
      margin-bottom: 12px;
    }

    .welcome p {
      color: #9aa3b5;
      line-height: 1.5;
    }

    .input-area {
      padding: 15px;
      background: #080b14;
      border-top: 1px solid #202637;
    }

    .input-box {
      max-width: 800px;
      margin: auto;
      display: flex;
      gap: 10px;
    }

    input {
      flex: 1;
      padding: 15px;
      border-radius: 12px;
      border: 1px solid #30384d;
      background: #111624;
      color: white;
      font-size: 16px;
      outline: none;
    }

    button {
      padding: 15px 20px;
      border: none;
      border-radius: 12px;
      background: #ffffff;
      color: #05070d;
      font-weight: bold;
      cursor: pointer;
    }

    button:hover {
      opacity: 0.85;
    }

    #messages {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .message {
      padding: 14px;
      border-radius: 12px;
      background: #111624;
      line-height: 1.5;
    }

    .user {
      background: #1c2638;
      align-self: flex-end;
      max-width: 80%;
    }

    .ai {
      align-self: flex-start;
      max-width: 80%;
    }
  </style>
</head>

<body>

  <div class="app">

    <header>
      <h1>⚡ Light Speed Future</h1>
      <p>Your personal AI assistant</p>
    </header>

    <main class="chat">

      <div id="messages">

        <div class="welcome" id="welcome">
          <h2>Welcome to Light Speed Future</h2>
          <p>
            Your personal AI assistant is being built.
            <br>
            Ask me something to test the interface.
          </p>
        </div>

      </div>

    </main>

    <div class="input-area">
      <div class="input-box">

        <input
          id="userInput"
          type="text"
          placeholder="Ask Light Speed Future..."
        >

        <button onclick="sendMessage()">Send</button>

      </div>
    </div>

  </div>

  <script>

    function sendMessage() {

      const input = document.getElementById("userInput");
      const messages = document.getElementById("messages");
      const welcome = document.getElementById("welcome");

      const text = input.value.trim();

      if (text === "") return;

      if (welcome) {
        welcome.remove();
      }

      const userMessage = document.createElement("div");
      userMessage.className = "message user";
      userMessage.textContent = text;

      messages.appendChild(userMessage);

      input.value = "";

      const aiMessage = document.createElement("div");
      aiMessage.className = "message ai";
      aiMessage.textContent =
        "I'm Light Speed Future. My AI brain isn't connected yet, but we're building it now.";

      messages.appendChild(aiMessage);
    }

  </script>

</body>
</html>
